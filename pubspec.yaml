name: nice_pos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.14.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.3.0
  # Masaüstü sidebar nav öğelerini gerçek <a href> ile sarmak için (sağ/orta tık →
  # "yeni sekmede aç"). pubspec.lock'ta zaten transitive 6.3.2 mevcut; sürüm çakışması yok.
  url_launcher: ^6.3.2
  intl: ^0.20.2
  excel: ^4.0.6
  file_picker: ^11.0.2
  uuid: ^4.5.3
  web: ^1.1.0
  path_provider: ^2.1.5
  mobile_scanner: ^6.0.5
  fl_chart: ^0.68.0
  google_fonts: ^8.1.0
  archive: ^3.6.1
  xml: ^6.6.1
  # Raf etiketi (KARAR v1.10): Code128 barkod çizgileri. barcode_widget → önizlemede
  # Flutter widget; barcode → baskı HTML'inde SVG (toSvg) gömme.
  barcode: ^2.2.9
  barcode_widget: ^2.0.4
  # Raf etiketi PDF üretimi (KARAR v1.11): her platformda gerçek A4 PDF (pw.Document)
  # + native yazdırma/paylaşım (Printing.layoutPdf). Web'de Yazdır hâlâ window.print.
  pdf: ^3.11.1
  printing: ^5.13.3
  # Barkod okutma sesi (KARAR v1.14.1): asset dosyası YOK — kısa WAV byte'ları
  # kod içinde sentezlenir (core/utils/scan_sound.dart) ve BytesSource ile çalınır.
  # Tek codepath ile hem web hem Android'de çalışır.
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.5
  # Mobil çevrimdışı ürün ekleme/düzenleme (offline sync): yerel ürün kataloğu
  # aynası + bekleyen kayıt kuyruğu (sqflite), bağlantı değişikliği tetikleyicisi
  # (connectivity_plus — TEK BAŞINA yeterli değil, gerçek erişilebilirlik ayrıca
  # bir Supabase round-trip ile doğrulanır, bkz. product_sync_service.dart).
  # İkisi de yalnız native/Android'de kullanılır (!kIsWeb guard).
  sqflite: ^2.4.1
  connectivity_plus: ^6.1.3
  # Son bilinen bağlantı durumunu (phase + son prob zamanı) kalıcı tutar —
  # soğuk açılışta bilinen bir dead-zone'da ilk prob'u beklemeden offline
  # varsayılabilsin diye (bkz. connectivity_status_service.dart). Zaten
  # supabase_flutter üzerinden transitive geliyordu, burada doğrudan sabitlendi.
  shared_preferences: ^2.3.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14
  # App icon (Android + web) + splash screen üretimi — kaynak: pos.png (NiCE
  # tente logosu). `dart run flutter_launcher_icons` / `dart run
  # flutter_native_splash:create` ile yeniden üretilir; ikisi de yalnız build
  # zamanı araçları, uygulamaya derlenmez.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Geniş Logo etiket sekmesi (KARAR v1.14 / v1.14.2) — sabit TAM marka figürü
    # (turuncu tente + NiCE + beyaz gövde + yan çizgiler + alt çizgi). RENKLİ
    # basılır (siyah/beyaz kuralının bilinçli marka istisnası). Figür her hücreyi
    # doldurur; fiyat/ad/barkod üzerine bindirilir. Tek firma, hep aynı; bu
    # sekmede logo yükleme yoktur.
    - genis_logo_figur.png

    # İndirim Etiketi sekmesi — sabit "DİDİM NiCE" marka logosu (tente + NiCE
    # kutusu), kaynak Nice.png'den tagline metni kırpılmış (etiket kendi
    # kod-render'lı "EV GEREÇLERİ & HIRDAVAT" satırını kullanır, çift metin
    # olmasın diye). RENKLİ basılır. Tek firma, hep aynı; bu sekmede de logo
    # yükleme yoktur (Geniş Logo ile aynı desen).
    - nice_logo_indirim.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "pos.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "pos.png"
    background_color: "#ffffff"
    theme_color: "#1B2A4A"

flutter_native_splash:
  color: "#ffffff"
  image: "pos.png"
  android_12:
    image: "pos.png"
    color: "#ffffff"
  web: false
